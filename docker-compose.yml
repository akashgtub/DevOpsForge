
services:
  db:
    image: postgres:16
    container_name: devopsforge-postgres
    environment:
      POSTGRES_USER: devopsforge
      POSTGRES_PASSWORD: devopsforge_local_dev
      POSTGRES_DB: devopsforge
    ports:
      - "5432:5432"
    volumes:
      - devopsforge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devopsforge -d devopsforge"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: devopsforge-api:0.1.0
    container_name: devopsforge-api
    environment:
      DATABASE_URL: postgresql+psycopg://devopsforge:devopsforge_local_dev@db:5432/devopsforge
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  devopsforge_pgdata:
    external: true
